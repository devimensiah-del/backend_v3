version: "3.9"

services:
  mock-postgres:
    image: postgres:15-alpine
    container_name: backend_v3_mock_postgres
    environment:
      POSTGRES_USER: mock
      POSTGRES_PASSWORD: mock
      POSTGRES_DB: backend_v3
    ports:
      - "5433:5432"
    volumes:
      - ./dev/mockdb/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mock -d backend_v3"]
      interval: 5s
      timeout: 3s
      retries: 10
