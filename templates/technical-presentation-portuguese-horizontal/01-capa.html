<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IMENSIAH - Arquitetura Técnica</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Manrope:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    @page {
      size: A4 landscape;
      margin: 0;
    }

    :root {
      --navy-900: #0A101D;
      --navy-800: #162032;
      --gold-500: #B89E68;
      --surface-paper: #F7F6F4;
      --line-color: #E5E0D6;
      --text-primary: #111827;
      --text-secondary: #52525B;
      --font-heading: 'Manrope', sans-serif;
      --font-body: 'Inter', sans-serif;
    }

    body {
      font-family: var(--font-body);
      background: var(--navy-900);
      color: white;
      width: 297mm;
      height: 210mm;
      margin: 0 auto;
      overflow: hidden;
    }

    .slide {
      width: 297mm;
      height: 210mm;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      position: relative;
      background: linear-gradient(135deg, var(--navy-900) 0%, var(--navy-800) 100%);
    }

    .gold-accent {
      position: absolute;
      top: 50%;
      left: 35mm;
      width: 4px;
      height: 80mm;
      transform: translateY(-50%);
      background: var(--gold-500);
    }

    .content {
      text-align: center;
      max-width: 200mm;
    }

    .logo {
      font-family: var(--font-heading);
      font-size: 72px;
      font-weight: 500;
      letter-spacing: -0.03em;
      margin-bottom: 20px;
    }

    .logo span {
      color: var(--gold-500);
    }

    .subtitle {
      font-family: var(--font-heading);
      font-size: 28px;
      font-weight: 300;
      letter-spacing: 0.05em;
      color: rgba(255, 255, 255, 0.9);
      margin-bottom: 40px;
    }

    .divider {
      width: 80px;
      height: 2px;
      background: var(--gold-500);
      margin: 0 auto 40px;
    }

    .tagline {
      font-family: var(--font-body);
      font-size: 16px;
      font-weight: 400;
      color: rgba(255, 255, 255, 0.6);
      letter-spacing: 0.02em;
    }

    .footer {
      position: absolute;
      bottom: 20mm;
      left: 35mm;
      right: 35mm;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .date {
      font-family: var(--font-heading);
      font-size: 12px;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.4);
      letter-spacing: 0.1em;
    }

    .page-number {
      font-family: var(--font-heading);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.15em;
      color: var(--gold-500);
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="gold-accent"></div>

    <div class="content">
      <h1 class="logo">IMENS<span>IAH</span></h1>
      <p class="subtitle">ARQUITETURA TÉCNICA</p>
      <div class="divider"></div>
      <p class="tagline">Plataforma de Inteligência Estratégica com IA</p>
    </div>

    <div class="footer">
      <span class="date">NOVEMBRO 2025</span>
      <span class="page-number">01 / 10</span>
    </div>
  </div>
</body>
</html>
