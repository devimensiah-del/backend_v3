<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IMENSIAH - Technical Architecture</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Manrope:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    @page {
      size: A4 landscape;
      margin: 0;
    }

    :root {
      --navy-900: #0A101D;
      --navy-800: #162032;
      --navy-700: #1F2937;
      --gold-500: #B89E68;
      --gold-600: #A18852;
      --surface-paper: #F7F6F4;
      --line-color: #E5E0D6;
      --text-primary: #111827;
      --text-secondary: #52525B;
      --font-heading: 'Manrope', sans-serif;
      --font-body: 'Inter', sans-serif;
    }

    body {
      font-family: var(--font-body);
      background: var(--navy-900);
      color: white;
      width: 297mm;
      height: 210mm;
      margin: 0 auto;
      overflow: hidden;
    }

    .slide {
      width: 297mm;
      height: 210mm;
      padding: 25mm 35mm;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      background: linear-gradient(135deg, var(--navy-900) 0%, var(--navy-800) 100%);
    }

    .slide::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 400 400' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
      opacity: 0.03;
      pointer-events: none;
    }

    .gold-bar {
      position: absolute;
      top: 0;
      left: 35mm;
      right: 35mm;
      height: 4px;
      background: var(--gold-500);
    }

    .header {
      position: relative;
      z-index: 1;
    }

    .eyebrow {
      font-family: var(--font-heading);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--gold-500);
      margin-bottom: 12px;
    }

    .main-content {
      flex: 1;
      display: flex;
      flex-direction: row;
      justify-content: space-between;
      align-items: center;
      position: relative;
      z-index: 1;
    }

    .left-content {
      max-width: 55%;
    }

    .logo {
      font-family: var(--font-heading);
      font-size: 64px;
      font-weight: 300;
      letter-spacing: -0.025em;
      margin-bottom: 20px;
      line-height: 1.1;
    }

    .logo span {
      color: var(--gold-500);
    }

    .title {
      font-family: var(--font-heading);
      font-size: 32px;
      font-weight: 500;
      letter-spacing: -0.025em;
      line-height: 1.2;
      margin-bottom: 24px;
      color: white;
    }

    .subtitle {
      font-family: var(--font-body);
      font-size: 16px;
      font-weight: 300;
      line-height: 1.6;
      color: rgba(255, 255, 255, 0.7);
      max-width: 380px;
    }

    .right-content {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 16px;
    }

    .tech-badge {
      font-family: var(--font-heading);
      font-size: 9px;
      font-weight: 600;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--gold-500);
      border: 1px solid var(--gold-500);
      padding: 8px 16px;
      opacity: 0.8;
    }

    .footer {
      position: relative;
      z-index: 1;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
    }

    .version {
      font-family: var(--font-heading);
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.5);
    }

    .date {
      font-family: var(--font-body);
      font-size: 14px;
      color: rgba(255, 255, 255, 0.5);
    }

    .grid-pattern {
      position: absolute;
      bottom: 0;
      right: 0;
      width: 120mm;
      height: 120mm;
      opacity: 0.05;
      background-image:
        linear-gradient(rgba(255,255,255,0.3) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.3) 1px, transparent 1px);
      background-size: 15mm 15mm;
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="gold-bar"></div>
    <div class="grid-pattern"></div>

    <div class="header">
      <div class="eyebrow">Technical Documentation</div>
    </div>

    <div class="main-content">
      <div class="left-content">
        <div class="logo">IMENS<span>IAH</span></div>
        <h1 class="title">Platform Technical<br>Architecture</h1>
        <p class="subtitle">
          AI-Powered Strategic Business Intelligence.
          A comprehensive view of the architecture, data flows, and system components.
        </p>
      </div>
      <div class="right-content">
        <div class="tech-badge">Go Backend</div>
        <div class="tech-badge">Next.js Frontend</div>
        <div class="tech-badge">Claude AI</div>
        <div class="tech-badge">Gemini Search</div>
        <div class="tech-badge">PostgreSQL</div>
      </div>
    </div>

    <div class="footer">
      <div class="version">Version 3.0</div>
      <div class="date">November 2025</div>
    </div>
  </div>
</body>
</html>
